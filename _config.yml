title: Officina Digitale
description: Un sito di prova per capire Jekyll
url: "https://davidecappe.github.io"
baseurl: "/test-jekyll-theme"
author: Davide
social:
  twitter: davidecappe
  github: davidecappe

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2

pagination:
  enabled: true
  per_page: 5
  permalink: "/blog/:num/"
  title: ":title - page :num"
  trail: 2
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

collections:
  progetti:
    output: true
    permalink: /progetti/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
